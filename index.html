<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="준플레이(@junplayj) 공식 Instagram API 미디어 호스팅 및 정책 안내 페이지">
  <title>준플레이 | JUNPLAYJ</title>
  <style>
    :root { color-scheme: dark; --bg:#071119; --card:#0e1d27; --line:#243743; --text:#f4f7f8; --muted:#aab8c1; --lime:#9cff16; --blue:#25b7f3; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Arial,"Noto Sans KR",sans-serif; background:var(--bg); color:var(--text); }
    main { width:min(880px,calc(100% - 32px)); margin:0 auto; padding:72px 0; }
    .hero { display:grid; grid-template-columns:180px 1fr; gap:32px; align-items:center; }
    .hero img { width:180px; height:180px; object-fit:cover; border-radius:50%; border:4px solid var(--lime); }
    h1 { margin:0 0 10px; font-size:clamp(40px,8vw,76px); letter-spacing:-2px; }
    h1 span { color:var(--lime); }
    .tagline { color:var(--blue); font-weight:700; letter-spacing:1px; }
    .card { margin-top:42px; padding:28px; border:1px solid var(--line); border-radius:20px; background:var(--card); }
    p { color:var(--muted); line-height:1.75; }
    nav { display:flex; flex-wrap:wrap; gap:12px; margin-top:22px; }
    a { color:var(--text); }
    nav a { padding:12px 16px; border:1px solid var(--line); border-radius:999px; text-decoration:none; }
    nav a:hover { border-color:var(--lime); }
    footer { margin-top:48px; color:var(--muted); font-size:14px; }
    @media (max-width:620px) { .hero { grid-template-columns:1fr; } .hero img { width:128px; height:128px; } }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <img src="assets/junplayj_profile.jpg" alt="준플레이 골프 이미지">
      <div>
        <h1>JUN<span>PLAY</span>J</h1>
        <div class="tagline">GOLF · BADMINTON · BASEBALL</div>
        <p>스포츠를 즐기고, 기록하고, 함께 성장하는 라이프스타일 스포츠 크리에이터입니다.</p>
      </div>
    </section>
    <section class="card">
      <h2>Instagram API 미디어 호스팅</h2>
      <p>이 사이트는 준플레이 공식 Instagram 계정의 승인된 콘텐츠를 Meta Instagram API에 전달하기 위한 공개 미디어 주소와 정책 문서를 제공합니다.</p>
      <nav aria-label="정책 및 채널 링크">
        <a href="privacy.html">개인정보처리방침</a>
        <a href="data-deletion.html">데이터 삭제 안내</a>
        <a href="https://www.instagram.com/junplayj/" rel="noopener noreferrer">Instagram @junplayj</a>
        <a href="https://blog.naver.com/choise76" rel="noopener noreferrer">네이버 블로그 준플레이</a>
      </nav>
    </section>
    <footer>© 2026 JUNPLAYJ. All rights reserved.</footer>
  </main>
</body>
</html>
